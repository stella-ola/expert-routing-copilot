name: Run AI (LLM) evals

# Manual button: Actions tab -> "Run AI (LLM) evals" -> Run workflow.
# One-time setup: Settings -> Secrets and variables -> Actions -> New repository secret
#   Name: ANTHROPIC_API_KEY   Value: your key from the Claude Console
# The key stays hidden; it is never written to the repo or shown in logs.
# Results are proposed in a new branch and pull request. Merging that PR updates GitHub Pages.

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "Times to run each case (3 measures consistency)"
        default: "3"
        required: true
        type: choice
        options:
          - "3"
          - "1"
      model:
        description: "Model ID"
        default: "claude-haiku-5-5"
        required: true
        type: choice
        options:
          - "claude-haiku-5-5"

permissions:
  contents: read

concurrency:
  group: llm-evals
  cancel-in-progress: false

jobs:
  llm-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check the API key secret is set
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Add a repository secret named ANTHROPIC_API_KEY first (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi

      - name: Rules baseline (free, local)
        run: npm run evals

      - name: Run policy and grounding tests before paid calls
        run: npm test

      - name: LLM extractor, same policy
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: ${{ inputs.model }}
          EVAL_RUNS: ${{ inputs.runs }}
        run: node evals/run-evals.mjs --llm --runs "$EVAL_RUNS"

      - name: Build the comparison
        run: npm run compare

      - name: Show results on the run page
        if: always()
        run: |
          [ -f data/comparison.md ] && cat data/comparison.md >> "$GITHUB_STEP_SUMMARY"
          [ -f data/eval-results-llm.md ] && cat data/eval-results-llm.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save results to a review branch and open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL_NAME: ${{ inputs.model }}
          EVAL_RUNS: ${{ inputs.runs }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          RESULTS_BRANCH="automation/llm-eval-results-${GITHUB_RUN_ID}"
          git checkout -b "$RESULTS_BRANCH"
          git add data/eval-results-llm.json data/eval-results-llm.md data/comparison.md docs/data/eval-results-llm.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update LLM eval results ($MODEL_NAME, $EVAL_RUNS runs)"
            git push --set-upstream origin "$RESULTS_BRANCH"
            COMPARE_URL="https://github.com/${GITHUB_REPOSITORY}/compare/main...${RESULTS_BRANCH}?expand=1"
            echo "Review the generated results: $COMPARE_URL" >> "$GITHUB_STEP_SUMMARY"
            gh pr create \
              --base main \
              --head "$RESULTS_BRANCH" \
              --title "Update recorded LLM evaluation results" \
              --body "Synthetic evaluation generated by the manual **Run AI (LLM) evals** workflow. Review the metrics, failures, cost, and consistency before merging. Merging updates the public Rules vs AI tab through the existing GitHub Pages deployment." \
              || echo "::warning::The results branch was pushed, but GitHub could not create the pull request automatically. Use the comparison link in the run summary."
          fi
